name: olist
version: "1.0.0"
config-version: 2
profile: olist

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  olist:
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]
    intermediate:
      +schema: staging          # no separate schema: the dbt login only owns staging + marts
      +materialized: view
      +tags: ["intermediate"]
    marts:
      +schema: marts
      +materialized: table
      dimensions:
        +tags: ["dimension"]
      facts:
        +tags: ["fact"]
