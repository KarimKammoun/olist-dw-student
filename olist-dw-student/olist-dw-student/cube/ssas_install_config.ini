; =====================================================================================
;  TP8 - unattended install of an Analysis Services (Multidimensional) instance.
;  SQL Server Express has no Analysis Services, so a second instance is installed from
;  the free SQL Server 2022 DEVELOPER media (non-production use only).
;
;  BEFORE RUNNING: replace PC-NAME\user below by your own account.
;    whoami          ->  pc-name\user   (paste it as is inside the quotes)
;
;  RUN (PowerShell as administrator, from the folder that contains setup.exe):
;    .\setup.exe /ConfigurationFile="C:\dev\ssas_install_config.ini" /IACCEPTSQLSERVERLICENSETERMS /QUIET
;
;  What this file does:
;    - installs ONLY Analysis Services (FEATURES=AS), no database engine:
;      Express keeps the OlistDW warehouse, SSAS only hosts the cube;
;    - creates the DEFAULT instance (MSSQLSERVER), because Express is a NAMED
;      instance (SQLEXPRESS) and the default name is still free. That gives the
;      service name used everywhere in this project: MSSQLServerOLAPService;
;    - MULTIDIMENSIONAL mode (not Tabular: the TP is about a multidimensional cube);
;    - the service runs as the virtual account NT Service\MSSQLServerOLAPService,
;      which is the account include/sql/05_ssas_service_access.sql grants access to;
;    - you are added as an SSAS administrator (ASSYSADMINACCOUNTS).
; =====================================================================================

[OPTIONS]

; ---- what to install
ACTION="Install"
FEATURES=AS
IAcceptSQLServerLicenseTerms="True"

; ---- instance name: default instance
INSTANCENAME="MSSQLSERVER"
INSTANCEID="MSSQLSERVER"

; ---- Analysis Services configuration
ASSERVERMODE="MULTIDIMENSIONAL"
ASSVCACCOUNT="NT Service\MSSQLServerOLAPService"
ASSVCSTARTUPTYPE="Automatic"

; ---- SSAS administrators: PUT YOUR OWN WINDOWS ACCOUNT HERE
;      (output of `whoami`, e.g. "DESKTOP-ABC123\karim")
ASSYSADMINACCOUNTS="PC-NAME\user"

; ---- optional: keep the SSAS data next to the project instead of on C:
; ASDATADIR="C:\dev\ssas\data"
; ASLOGDIR="C:\dev\ssas\log"
; ASBACKUPDIR="C:\dev\ssas\backup"
; ASCONFIGDIR="C:\dev\ssas\config"
; ASTEMPDIR="C:\dev\ssas\temp"
