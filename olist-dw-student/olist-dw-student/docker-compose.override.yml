# SQL Server runs on the Windows host, NOT in Docker.
# Containers reach it at host.docker.internal (built in on Docker Desktop for Windows/macOS).
services:
  scheduler:
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux only, harmless elsewhere
    # The 8081:8081 mapping (used to serve `dbt docs` from the container) is OPTIONAL and
    # breaks `astro dev start` on any machine where 8081 is already taken:
    #   Bind for 0.0.0.0:8081 failed: port is already allocated
    # The labs never need it, so it stays commented out. Uncomment only if you really
    # need the dbt documentation server from inside the container.
    # ports:
    #   - "8081:8081"
